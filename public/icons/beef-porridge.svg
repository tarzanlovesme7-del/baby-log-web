<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- 소고기 베이스죽 — 흰죽과 같은 그릇에, 죽은 한 톤 따뜻하게(오트밀·양파가
       섞여 누르스름하다) 그리고 위에 소고기 덩이 셋과 무 조각 둘.
       흰죽 그림과 나란히 서도 한눈에 갈리게 고기 색을 크게 둔다. -->
  <path fill="#f4e2c2" d="M13.5 34 A22.5 13.5 0 0 1 58.5 34 Z"/>
  <path fill="#e9d3ab" d="M22 29.5 A14 6.2 0 0 1 50 29.5 A14 6.2 0 0 1 22 29.5 Z" opacity="0.6"/>
  <!-- 소고기 — 소고기 그림과 같은 붉은색이라야 '고기가 든 죽'으로 읽힌다.
       갈색으로 칠했더니 팥죽처럼 보였다. -->
  <ellipse cx="27" cy="25.6" rx="5.4" ry="3.8" fill="#e0563c"/>
  <ellipse cx="26.2" cy="24.6" rx="2.8" ry="1.5" fill="#f58a6c"/>
  <ellipse cx="42" cy="24" rx="5" ry="3.5" fill="#d84f36"/>
  <ellipse cx="41.3" cy="23.1" rx="2.5" ry="1.3" fill="#f58a6c"/>
  <ellipse cx="46.5" cy="29.6" rx="4.2" ry="2.9" fill="#e0563c"/>
  <!-- 무 -->
  <rect x="33.2" y="27" width="4.8" height="4" rx="1.1" fill="#fffaf0"/>
  <rect x="19.8" y="29.6" width="4" height="3.3" rx="1" fill="#fffaf0"/>
  <!-- 그릇 -->
  <path fill="#e0a86e" d="M9 34 A27 24 0 0 0 63 34 Z"/>
  <path fill="#cf8e4c" d="M14.6 48 A27 24 0 0 0 57.4 48 A33 20 0 0 1 14.6 48 Z" opacity="0.45"/>
  <rect x="6" y="30.6" width="60" height="6.8" rx="3.4" fill="#f4ead6"/>
</svg>
