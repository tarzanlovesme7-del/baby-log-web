<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Baby Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    /* ---- Toss(TDS)-derived light tokens (verified from toss.im / TDS Mobile docs) ----
       Flat color layering, not borders or shadows, is how Toss separates surfaces —
       see foundations "no canonical shadow token... use flat color layering." */
    --bg: #f2f4f6;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --fg: #191f28;
    --muted: #4e5968;
    --muted-2: #8b95a1;
    --border: #e5e8eb;
    --primary: #3182f6;
    --primary-hover: #2272eb;
    --primary-fg: #ffffff;
    --primary-weak-bg: #e8f3ff;
    --primary-weak-fg: #1b64da;
    --link: #1b64da;
    --danger: #e42939;
    --memo-bg: #fff3c4;
    --memo-fg: #8a6a00;
    --nf-bg: #ffe7c2;
    --nf-fg: #8a5300;
    --radius-pill: 999px;
    --radius-card: 20px;
    --radius-sm: 14px;

    /* category accents (extension — not part of the TDS doc, chosen to stay legible
       as both flat icon chips and weak-tint badges alongside the Toss blue) */
    --c-feed:#ff9f0a; --c-diaper:#ac8058; --c-bath:#1ec8d8; --c-sleep:#8b5cf6;
    --c-med:#26b876; --c-probiotic:#0aa88f; --c-play:#3182f6; --c-tummy:#ff5673; --c-nose:#3ba9e8;
    --c-nails:#e8b100; --c-temp:#ff6b5e; --c-massage:#f472b6; --c-custom:#8b95a1;

    /* "Apple SD Gothic Neo" is a system font — it isn't fetched, it's simply named first
       so it's used natively on the family's iPhones/Macs. Gothic A1 (loaded via Google
       Fonts, the only external host the Artifact CSP allows) is the fallback for anyone
       on Android — e.g. the nanny, if she isn't on an iPhone. For Vietnamese we use Be
       Vietnam Pro instead of a system fallback: a geometric, rounded sans built for
       Vietnamese (set below via :root[lang="vi"]). */
    --font: "Apple SD Gothic Neo", "Gothic A1", -apple-system, BlinkMacSystemFont,
      "Malgun Gothic", "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1116; --surface:#181c23; --surface-2:#232833;
      --fg:#f5f7fa; --muted:#b7bfca; --muted-2:#7c8591;
      --border: rgba(255,255,255,0.08);
      --primary:#4c8dff; --primary-hover:#6ba0ff; --primary-fg:#ffffff;
      --primary-weak-bg:#16294a; --primary-weak-fg:#7db8ff; --link:#7db8ff;
      --danger:#ff5b6a;
      --memo-bg:#3d3111; --memo-fg:#f3cf4d;
      --nf-bg:#40290f; --nf-fg:#ffb768;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1116; --surface:#181c23; --surface-2:#232833;
    --fg:#f5f7fa; --muted:#b7bfca; --muted-2:#7c8591;
    --border: rgba(255,255,255,0.08);
    --primary:#4c8dff; --primary-hover:#6ba0ff; --primary-fg:#ffffff;
    --primary-weak-bg:#16294a; --primary-weak-fg:#7db8ff; --link:#7db8ff;
    --danger:#ff5b6a;
    --memo-bg:#3d3111; --memo-fg:#f3cf4d;
    --nf-bg:#40290f; --nf-fg:#ffb768;
  }
  :root[lang="vi"]{
    --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, "Noto Sans", Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  button, input, textarea, select{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; outline:none; border:0; background:none; -webkit-appearance:none; appearance:none; }
  a{ color:var(--link); }
  [hidden]{ display:none !important; }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  #app{ max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .baby-id{ display:flex; flex-direction:column; line-height:1.2; }
  .baby-id b{ font-size:21px; font-weight:800; letter-spacing:-.4px; }
  .baby-id span{ font-size:12px; color:var(--muted-2); font-weight:600; font-variant-numeric:tabular-nums; }
  .top-actions{ display:flex; align-items:center; gap:6px; }
  /* header.top sits on a translucent tint of --bg, and --surface-2 is nearly
     the same lightness as --bg — so on the header specifically these two
     pills need the stronger --surface contrast (plus a hairline ring) to
     read as distinct controls rather than blending into the header. */
  .lang-pill{
    display:flex; border-radius:var(--radius-pill); background:var(--surface); overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--border);
  }
  .lang-pill button{
    border:0; background:transparent; padding:7px 12px; font-size:12px; font-weight:800; color:var(--muted);
  }
  .lang-pill button[aria-pressed="true"]{ background:var(--primary); color:var(--primary-fg); }
  .profile-pill{
    display:flex; align-items:center; height:34px; padding:0 14px; border-radius:var(--radius-pill);
    background:var(--surface); color:var(--fg); font-size:12.5px; font-weight:800;
    max-width:104px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto;
    box-shadow:inset 0 0 0 1px var(--border);
  }

  /* ---------- active/stopwatch bar — a pastel tint of the category color
     (same color-mix formula as the icon chips), not a saturated fill.
     Lives inside today's day-group in the timeline, right under the date. ---------- */
  .active-bar{
    margin:0 0 14px; border-radius:16px;
    background:color-mix(in srgb, var(--active-color, var(--c-feed)) 26%, var(--surface-2));
    color:var(--fg); padding:14px 16px; display:flex; align-items:center; gap:12px;
  }
  .active-bar.paused{ opacity:.7; }
  .active-bar .aw-emoji{ font-size:26px; line-height:1; flex:0 0 auto; }
  .active-bar .aw-time{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; min-width:78px; }
  .active-bar .aw-meta{ flex:1; min-width:0; }
  .active-bar .aw-meta b{ display:block; font-size:14px; }
  .active-bar .aw-meta span{ font-size:12px; color:var(--muted); }
  .active-bar .aw-actions{ display:flex; gap:8px; }
  .aw-round{
    width:36px; height:36px; border-radius:50%; border:0; background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--fg); font-size:15px; font-weight:800;
  }
  .aw-round.confirm{ background:var(--primary); color:var(--primary-fg); }

  /* ---------- section ---------- */
  section.panel{ padding:16px 16px 8px; display:flex; flex-direction:column; gap:18px; }
  /* surfaces are told apart by flat color contrast against --bg, never a border/shadow */
  .card{ background:var(--surface); border-radius:var(--radius-card); }

  /* dashboard (last-fed / last-diaper / last-sleep) — plain text on the page background */
  .dashboard{ display:flex; padding:4px 2px 6px; gap:4px; }
  .dash-item{ flex:1; text-align:center; padding:0 4px; }
  .dash-item .d-emoji{ font-size:20px; line-height:1; margin-bottom:7px; }
  .dash-item .d-label{ font-size:11.5px; color:var(--muted-2); margin-bottom:4px; font-weight:700; }
  .dash-item .d-val{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .dash-item .d-sub{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  /* wraps memo + next-feed bands into one flex child of .panel so its
     gap:18px doesn't insert space between the two stacked full-bleed bands */
  .announce-stack{ display:flex; flex-direction:column; }

  /* memo preview — no box: a full-bleed color band, tap jumps to the memo tab */
  .announce-row{
    width:calc(100% + 32px); margin:0 -16px; display:flex; align-items:center; gap:9px;
    padding:15px 16px; text-align:left; background:var(--memo-bg); border-radius:0;
  }
  .announce-row .a-emoji{ font-size:17px; flex:0 0 auto; }
  .announce-row .a-label{ font-size:12.5px; font-weight:800; color:var(--memo-fg); flex:0 0 auto; }
  .announce-row .a-preview{ flex:1; min-width:0; font-size:12.5px; color:var(--memo-fg); opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .announce-row .a-chev{ flex:0 0 auto; color:var(--memo-fg); opacity:.6; font-size:17px; font-weight:700; }
  /* next-feed estimate — same flat band language as the memo preview above,
     stacked directly under it with its own peach tint instead of the memo's amber */
  .announce-row.next-feed-row{ background:var(--nf-bg); }
  .announce-row.next-feed-row .a-label,
  .announce-row.next-feed-row .a-preview{ color:var(--nf-fg); }
  .announce-row.next-feed-row .a-preview{ opacity:1; font-variant-numeric:tabular-nums; }

  /* quick actions — single row, swipeable, icon + label only (no card chrome) */
  .qa-grid{
    display:flex; gap:16px; overflow-x:auto; overflow-y:hidden; padding:4px 2px 8px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scrollbar-width:none; overflow-anchor:none;
  }
  .qa-grid::-webkit-scrollbar{ display:none; }
  .qa-btn{
    flex:0 0 auto; width:64px; scroll-snap-align:start; background:transparent; border:0; padding:0;
    display:flex; flex-direction:column; align-items:center; gap:8px; user-select:none;
    -webkit-user-select:none; touch-action:manipulation;
  }
  .qa-ico{ width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; line-height:1; transition:transform .15s ease; }
  .qa-btn:active .qa-ico{ transform:scale(.92); }
  .qa-btn.holding .qa-ico{ transform:scale(1.1); }
  .qa-label{ font-size:11.5px; font-weight:700; text-align:center; line-height:1.2; color:var(--muted); }
  .qa-add .qa-ico{ background:var(--surface-2); color:var(--muted-2); font-size:22px; font-weight:700; }

  /* timeline — a full-bleed white sheet that docks over the page canvas; the color
     change (and rounded top) is the separation, not a rule line */
  .timeline-section{
    background:var(--surface); border-radius:26px 26px 0 0; margin:16px -16px 0;
    padding:22px 18px calc(96px + env(safe-area-inset-bottom)); min-height:38vh;
  }
  .day-group + .day-group{ margin-top:30px; }
  .day-head{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 2px 12px; gap:8px; }
  .day-head .d-title{ font-size:12.5px; font-weight:800; color:var(--muted-2); text-transform:uppercase; letter-spacing:.3px; flex:0 0 auto; }
  .day-totals{ display:flex; gap:11px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; flex-wrap:wrap; justify-content:flex-end; }
  .day-totals b{ color:var(--fg); font-weight:800; }
  /* swipe-to-delete: .entry-row translates over a red delete layer sitting behind it */
  .entry-swipe{ position:relative; border-radius:14px; overflow:hidden; }
  /* opacity:0 at rest — not just "hidden behind the row": on some renderers the
     rounded corners of this full-bleed red layer and the row sitting on top of
     it don't clip in perfect lock-step, leaving a faint red antialiasing seam
     at the corners even when nothing is swiped. Fading it in only once a swipe
     actually starts (see wireEntrySwipe) removes any chance of that at rest. */
  .entry-delete-bg{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
    padding-right:22px; background:var(--danger); border-radius:14px;
    opacity:0; transition:opacity 120ms ease;
  }
  .entry-swipe.revealed .entry-delete-bg{ opacity:1; }
  .entry-delete-bg span{ color:#fff; font-size:13px; font-weight:800; }
  .entry-row{
    position:relative; display:flex; align-items:center; gap:13px; padding:11px 2px; border:0;
    background:var(--surface); width:100%; text-align:left; border-radius:14px; touch-action:pan-y;
  }
  .entry-row:active{ background:var(--surface-2); }
  .entry-row.flash{ animation: rowFlash 900ms ease; }
  @keyframes rowFlash{ 0%{ background:var(--primary-weak-bg); } 100%{ background:var(--surface); } }
  .e-dot{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; }
  .e-main{ flex:1; min-width:0; }
  .e-title{ font-size:14.5px; font-weight:700; }
  .e-sub{ font-size:12px; color:var(--muted); margin-top:1px; }
  .e-time{ font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .e-author{ display:block; font-size:10.5px; color:var(--muted-2); margin-top:1px; }
  .empty-note{ padding:50px 16px; text-align:center; color:var(--muted); font-size:13.5px; }

  /* memo tab — one full-width sheet (same shape/tone as .timeline-section),
     compose area on top separated from the list by a hairline, and memos
     stacked flat with a hairline between each rather than individual card
     boxes: an explicit, deliberate exception to the flat/borderless language
     used everywhere else, per direct request for this section specifically. */
  .memo-section{
    background:var(--surface); border-radius:26px 26px 0 0; margin:16px -16px 0;
    padding:20px 18px calc(96px + env(safe-area-inset-bottom)); min-height:38vh;
  }
  .memo-compose{
    display:flex; flex-direction:column; gap:10px;
    padding-bottom:20px; margin-bottom:6px; border-bottom:1px solid var(--border);
  }
  .memo-row{ padding:14px 2px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--border); }
  .memo-row:last-child{ border-bottom:0; }
  .memo-row .m-text{ font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .memo-row .m-translated{ font-size:13.5px; line-height:1.5; color:var(--muted); white-space:pre-wrap; word-break:break-word; padding-top:2px; }
  .memo-row .m-translated::before{ content:"↳ "; color:var(--muted-2); }
  .memo-row .m-meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .memo-row .m-meta span{ font-size:11px; color:var(--muted-2); }
  .memo-row .m-lang-tag{ font-size:10px; font-weight:800; border-radius:6px; padding:2px 6px; }
  .memo-row .m-lang-tag.lang-ko{ color:var(--primary); background:var(--primary-weak-bg); }
  .memo-row .m-lang-tag.lang-vi{ color:var(--danger); background:color-mix(in srgb, var(--danger) 16%, var(--surface)); }

  /* stats */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-tile{ padding:16px; }
  .stat-tile .st-label{ font-size:12px; color:var(--muted); margin-bottom:7px; font-weight:600; }
  .stat-tile .st-val{ font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-tile .st-val small{ font-size:12px; font-weight:500; color:var(--muted); }
  .bars{ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; height:120px; padding:16px 16px 8px; overflow-x:auto; scrollbar-width:none; }
  .bars::-webkit-scrollbar{ display:none; }
  .bar-col{ flex:0 0 26px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .bar-col .bar{ width:100%; max-width:26px; border-radius:8px 8px 3px 3px; background:var(--primary); min-height:3px; }
  .bar-col .bar-lbl{ font-size:10px; color:var(--muted); }
  .bar-col .bar-val{ font-size:10px; color:var(--muted-2); font-variant-numeric:tabular-nums; }
  .section-title{ font-size:13px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.12px; padding:0 2px; }

  /* poop-interval chart card — line+area chart with a day-scaled Y-axis,
     modeled on a phone Health-app "record interval" chart per direct request */
  .poop-chart-card{ padding:16px; display:flex; flex-direction:column; gap:14px; }
  .poop-chart-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .poop-chart-title{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.12px; }
  .poop-chart-title .poop-emoji{ font-size:15px; }
  .poop-recent-badge{ font-size:11px; font-weight:800; color:var(--muted-2); background:var(--surface-2); padding:4px 10px; border-radius:var(--radius-pill); flex:0 0 auto; }
  .poop-chart-svg{ width:100%; height:auto; display:block; overflow:visible; }
  .poop-grid-line{ stroke:var(--border); stroke-width:1; stroke-dasharray:2.5 3; }
  .poop-axis-y{ fill:var(--muted-2); font-size:8.5px; font-weight:700; }
  .poop-axis-x{ fill:var(--muted-2); font-size:7.5px; font-weight:600; }
  .poop-line{ stroke:var(--c-diaper); stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .poop-dot{ fill:var(--c-diaper); stroke:var(--surface); stroke-width:1.5; }
  .poop-value-lbl{ fill:var(--fg); font-size:8.5px; font-weight:800; }
  .poop-day-list{ display:flex; flex-direction:column; }
  .poop-day-group + .poop-day-group{ margin-top:16px; }
  .poop-day-title{ font-size:12px; font-weight:800; color:var(--muted-2); margin-bottom:6px; }
  .poop-day-row{ display:flex; align-items:baseline; gap:10px; padding:6px 0; font-size:13.5px; }
  .poop-day-row + .poop-day-row{ border-top:1px solid var(--border); }
  .poop-day-time{ font-weight:700; color:var(--fg); font-variant-numeric:tabular-nums; flex:0 0 auto; width:58px; }
  .poop-day-kind{ color:var(--fg); flex:0 0 auto; }
  .poop-day-note{ color:var(--muted); font-size:12px; }

  /* weekly pattern chart — flat stacked color bands per day, painted-on-top
     emoji marks for anything that isn't feed/sleep (color-only). horizontally
     swipeable so 7 days don't all have to fit on one screen at once. */
  .pattern-caption{ font-size:12px; color:var(--muted-2); padding:0 2px; margin-bottom:2px; }
  .pattern-chart-card{ padding:16px 14px 14px; display:flex; flex-direction:column; gap:12px; }
  .pattern-chart-inner{ display:flex; gap:10px; }
  .pattern-axis-v{
    flex:0 0 22px; display:flex; flex-direction:column; justify-content:space-between;
    height:456px; padding:1px 0; text-align:right;
  }
  .pattern-axis-v span{ font-size:10px; color:var(--muted-2); font-variant-numeric:tabular-nums; }
  .pattern-cols{
    display:flex; overflow-x:auto; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; overflow-anchor:none; padding-bottom:1px;
  }
  .pattern-cols::-webkit-scrollbar{ display:none; }
  .pattern-col{
    flex:0 0 50px; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; gap:7px;
    border-left:1px solid var(--bg);
  }
  .pattern-col:first-child{ border-left:0; }
  .pattern-col-track{ position:relative; width:100%; height:456px; background:var(--surface-2); }
  .pattern-grid-line-h{ position:absolute; left:0; right:0; height:1px; background:var(--border); }
  .pattern-mark-band{ position:absolute; left:0; right:0; }
  .pattern-mark-band.is-point{ height:6px; margin-top:-3px; }
  .pattern-mark-emoji{
    position:absolute; left:50%; top:0; transform:translate(-50%,-50%); font-size:14px; line-height:1;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .pattern-col-label{ font-size:10px; font-weight:600; color:var(--muted); text-align:center; line-height:1.3; }
  .pattern-col-label .pattern-col-date{ display:block; color:var(--muted-2); }
  .pattern-col.today .pattern-col-label{ color:var(--primary); font-weight:800; }
  .pattern-legend{ display:flex; flex-wrap:wrap; gap:10px 16px; padding:2px 4px 0; }
  .pattern-legend-item{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .pattern-legend-swatch{ width:20px; height:10px; flex:0 0 auto; }
  .pattern-legend-emoji-only{ font-size:14px; line-height:1; flex:0 0 auto; }

  /* settings — rows separated by spacing, not rule lines */
  .row-item{ display:flex; align-items:center; justify-content:space-between; padding:15px 16px; gap:12px; }
  .row-item .r-label{ font-size:14.5px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; }
  .chip{ padding:9px 15px; border-radius:var(--radius-pill); background:var(--surface-2); border:0; font-size:13px; font-weight:700; color:var(--fg); }
  .chip[aria-pressed="true"]{ background:var(--primary); color:var(--primary-fg); }
  .text-btn{ background:transparent; border:0; color:var(--link); font-size:14px; font-weight:700; padding:6px; }
  .danger-btn{ color:var(--danger); }

  /* tab bar */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:560px; margin:0 auto;
    background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{ flex:1; background:transparent; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--muted-2); }
  .tab-btn .tb-emoji{ font-size:19px; line-height:1; filter:grayscale(1); opacity:.55; }
  .tab-btn[aria-current="true"] .tb-emoji{ filter:none; opacity:1; }
  .tab-btn span{ font-size:10.5px; font-weight:700; }
  .tab-btn[aria-current="true"]{ color:var(--primary); }

  /* ---------- full pages (announcement / entry detail) ----------
     header/footer are a solid --surface bar over a --bg canvas — the color
     change is the separation, no border needed. */
  .fullpage{
    position:fixed; inset:0; z-index:45; background:var(--bg); overflow-y:auto;
    transform:translateX(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .fullpage.show{ transform:translateX(0); }
  .fp-head{
    position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 10px 14px 6px; background:var(--surface);
  }
  .fp-back{ width:32px; height:32px; border:0; background:transparent; font-size:22px; font-weight:800; color:var(--fg); flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:0; }
  .fp-head h1{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); margin:0;
    font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:calc(100% - 116px); pointer-events:none;
  }
  .fp-delete{ background:transparent; border:0; color:var(--danger); font-size:14px; font-weight:700; padding:6px 4px; flex:0 0 auto; margin-left:auto; }
  /* extra bottom padding clears the floating save button */
  .fp-body{ padding:20px 16px calc(100px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:20px; }
  /* floating, not a full-width bar docked to the edge — the shadow is deliberate here,
     it's the one place something should read as lifted off the page */
  .fp-foot{
    position:fixed; left:0; right:0; bottom:0; z-index:2; max-width:560px; margin:0 auto;
    padding:0 20px calc(20px + env(safe-area-inset-bottom)); pointer-events:none;
  }
  .fp-foot .btn{ pointer-events:auto; box-shadow:0 10px 26px rgba(20,30,50,.22); }

  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:7px; font-weight:700; text-transform:uppercase; letter-spacing:.1px; }
  .field input[type="time"], .field input[type="date"], .field input[type="number"], .field input[type="text"]{
    width:100%; padding:13px 14px; border-radius:14px; border:0; background:var(--surface-2); font-size:16px; color:var(--fg);
  }
  /* fp-entry-body sits on the grey page canvas, where surface-2 barely differs from it —
     use white here specifically so fields read as distinct fields, not a form-shaped page */
  #fp-entry-body .field input, #fp-entry-body .seg, #fp-entry-body .amount-row .amt-step{
    background:var(--surface);
  }
  .time-row{ display:flex; gap:10px; align-items:flex-end; }
  .time-row .field{ flex:1; }
  .time-row .time-sep{ padding-bottom:14px; color:var(--muted); font-size:13px; }
  .seg{ display:flex; gap:2px; border-radius:14px; background:var(--surface-2); padding:3px; }
  .seg button{ flex:1; border:0; background:transparent; border-radius:11px; padding:10px 4px; font-size:13.5px; font-weight:700; color:var(--muted); }
  .seg button[aria-pressed="true"]{ background:var(--primary); color:var(--primary-fg); }
  .amount-row{ display:flex; align-items:center; gap:10px; }
  .amount-row .amt-step{ width:42px; height:42px; border-radius:50%; background:var(--surface-2); border:0; font-size:19px; font-weight:800; flex:0 0 auto; }
  .amount-row input[type="number"]{ text-align:center; font-size:21px; font-weight:800; }
  input[type="range"]{ width:100%; accent-color:var(--primary); }
  .btn{ width:100%; padding:16px; border-radius:16px; border:0; font-size:16px; font-weight:800; }
  .btn.primary{ background:var(--primary); color:var(--primary-fg); }
  .btn.ghost{ background:var(--surface-2); color:var(--fg); }

  /* bottom sheets (used only for the small quick-pick flows: new custom type, who-am-i) —
     the scrim behind them supplies the contrast, so no shadow on the sheet itself */
  .scrim{ position:fixed; inset:0; background:rgba(15,20,28,.5); z-index:40; opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto;
    background:var(--surface); border-radius:24px 24px 0 0;
    max-height:88vh; overflow-y:auto; transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-head{ position:sticky; top:0; background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:14px 8px 10px 14px; }
  .sheet-head h2{ font-size:16px; margin:0; font-weight:800; }
  .sheet-head .grabber{ position:absolute; top:7px; left:50%; transform:translateX(-50%); width:36px; height:4px; border-radius:2px; background:var(--border); }
  .icon-btn{
    width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:0;
    display:flex; align-items:center; justify-content:center; color:var(--fg); flex:0 0 auto; font-size:14px; font-weight:700;
  }
  .sheet-body{ padding:16px; display:flex; flex-direction:column; gap:20px; }
  .sheet-foot{ display:flex; gap:10px; padding:4px 16px 18px; }
  .sheet-foot .btn{ flex:1; }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{ width:34px; height:34px; border-radius:50%; border:0; }
  .swatch[aria-pressed="true"]{ box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--fg); }
  .emoji-pick{ display:flex; gap:8px; flex-wrap:wrap; }
  .emoji-pick button{ width:44px; height:44px; border-radius:14px; background:var(--surface-2); border:0; font-size:19px; }
  .emoji-pick button[aria-pressed="true"]{ background:var(--primary-weak-bg); }

  .toast{
    position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
    background:var(--fg); color:var(--surface); padding:12px 20px; border-radius:var(--radius-pill); font-size:13px; font-weight:700;
    z-index:60; opacity:0; transition:opacity .2s ease, transform .2s ease; pointer-events:none;
    white-space:nowrap; max-width:88vw; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">

  <!-- ============ HEADER ============ -->
  <header class="top">
    <div class="top-row">
      <div class="baby-id">
        <b id="hd-name">아기</b>
        <span id="hd-age">D+0</span>
      </div>
      <div class="top-actions">
        <div class="lang-pill" id="lang-pill">
          <button type="button" data-lang="ko" aria-pressed="true">KO</button>
          <button type="button" data-lang="vi" aria-pressed="false">VI</button>
        </div>
        <button type="button" class="profile-pill" id="btn-profile" title="profile">
          <span id="profile-pill-text">-</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ TAB: RECORD ============ -->
  <section class="panel" id="tab-record" data-tab-panel>

    <!-- dashboard: last feed / diaper / sleep, plain text, no card -->
    <div class="dashboard" id="since-row"></div>

    <!-- memo + next-feed estimate: wrapped together so the two full-bleed
         bands sit flush with no gap (panel uses flex gap between children) -->
    <div class="announce-stack">
      <!-- memo: most recent memo, one-line preview, tap jumps to the memo tab -->
      <button type="button" class="announce-row" id="memo-open-btn">
        <span class="a-emoji">📝</span>
        <span class="a-label" data-i18n="memoLabel">메모</span>
        <span class="a-preview" id="memo-preview"></span>
        <span class="a-chev">›</span>
      </button>

      <!-- next recommended feed time, estimated from the last feed's amount -->
      <div class="announce-row next-feed-row" id="next-feed-row" hidden>
        <span class="a-emoji">🍼</span>
        <span class="a-label" data-i18n="nextFeedLabel">다음 추천 수유</span>
        <span class="a-preview" id="nf-text"></span>
      </div>
    </div>

    <div>
      <div class="section-title" data-i18n="quickAdd" style="margin-bottom:10px">빠른 기록</div>
      <div class="qa-grid" id="qa-grid"></div>
    </div>

    <div class="timeline-section">
      <div class="section-title" data-i18n="timeline" style="margin-bottom:10px">기록</div>
      <div id="timeline" style="display:flex;flex-direction:column;gap:14px;"></div>
    </div>
  </section>

  <!-- ============ TAB: MEMO ============ -->
  <section class="panel" id="tab-memo" data-tab-panel hidden>
    <div class="memo-section">
      <div class="memo-compose">
        <textarea id="memo-compose-text" data-i18n-ph="memoComposePh" rows="3" style="width:100%;border:0;background:var(--surface-2);border-radius:14px;padding:12px 13px;font-size:15px;color:var(--fg);resize:none;"></textarea>
        <div id="memo-compose-translate-wrap" hidden>
          <label style="display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:700;" id="memo-compose-translate-label"></label>
          <div id="memo-compose-translate-preview" style="width:100%;box-sizing:border-box;background:var(--surface-2);border-radius:14px;padding:12px 13px;font-size:14.5px;color:var(--fg);min-height:1.4em;"></div>
        </div>
        <button type="button" class="btn primary" id="memo-compose-submit" data-i18n="memoSubmit" style="padding:12px;">등록</button>
      </div>
      <div id="memo-list"></div>
    </div>
  </section>

  <!-- ============ TAB: PATTERN ============ -->
  <section class="panel" id="tab-pattern" data-tab-panel hidden>
    <div>
      <div class="section-title" style="margin-bottom:2px" data-i18n="patternTitle">주간 패턴</div>
      <div class="pattern-caption" data-i18n="patternCaption">최근 7일, 시간대별 기록</div>
    </div>
    <div class="card pattern-chart-card" id="pattern-chart-card">
      <div class="pattern-chart-inner">
        <div class="pattern-axis-v"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
        <div class="pattern-cols" id="pattern-cols"></div>
      </div>
    </div>
    <div class="pattern-legend" id="pattern-legend"></div>
    <div class="empty-note" id="pattern-empty" hidden data-i18n="patternEmpty">최근 7일간 기록이 없어요</div>
  </section>

  <!-- ============ TAB: STATS ============ -->
  <section class="panel" id="tab-stats" data-tab-panel hidden>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <div class="section-title" style="margin:0" data-i18n="statsFeed7">수유 통계</div>
      <div class="seg" id="stats-feed-range" style="width:180px">
        <button type="button" data-range="7" aria-pressed="true" data-i18n="range7">7일</button>
        <button type="button" data-range="14" aria-pressed="false" data-i18n="range14">14일</button>
        <button type="button" data-range="30" aria-pressed="false" data-i18n="range30">30일</button>
      </div>
    </div>
    <div class="stat-grid" id="stat-tiles"></div>
    <div class="card">
      <div class="bars" id="stat-bars"></div>
    </div>

    <div class="card poop-chart-card">
      <div class="poop-chart-head">
        <span class="poop-chart-title"><span class="poop-emoji">💩</span> <span data-i18n="poopStats">배변 통계</span></span>
        <span class="poop-recent-badge" id="poop-recent-badge"></span>
      </div>
      <div id="poop-chart-wrap"></div>
      <div id="poop-day-list" class="poop-day-list"></div>
    </div>

    <div class="section-title" data-i18n="statsSleep7">최근 7일 수면 통계</div>
    <div class="stat-grid" id="stat-sleep-tiles"></div>
  </section>

  <!-- ============ TAB: SETTINGS ============ -->
  <section class="panel" id="tab-settings" data-tab-panel hidden>
    <div>
      <div class="section-title" style="margin-bottom:8px" data-i18n="babyInfo">아기 정보</div>
      <div class="card">
        <div class="row-item">
          <div><div class="r-label" data-i18n="babyNameKo">이름 (한국어)</div></div>
          <input type="text" id="set-baby-name-ko" value="지오" style="text-align:right;border:0;background:transparent;font-size:14.5px;color:var(--fg);max-width:55%;" />
        </div>
        <div class="row-item">
          <div><div class="r-label" data-i18n="babyNameVi">이름 (베트남어)</div></div>
          <input type="text" id="set-baby-name-vi" value="Zio" style="text-align:right;border:0;background:transparent;font-size:14.5px;color:var(--fg);max-width:55%;" />
        </div>
        <div class="row-item">
          <div><div class="r-label" data-i18n="babyBirth">태어난 날</div></div>
          <input type="date" id="set-baby-birth" value="2026-05-11" style="border:0;background:transparent;font-size:14.5px;color:var(--fg);" />
        </div>
      </div>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:8px" data-i18n="whoAmI">나는 누구</div>
      <div class="card">
        <div class="chip-row" id="author-chip-row"></div>
        <div class="row-item" style="background:var(--surface-2);border-radius:14px;margin:0 8px 8px;">
          <input type="text" id="author-custom-input" data-i18n-ph="authorCustomPh" style="border:0;background:transparent;font-size:14.5px;flex:1;color:var(--fg);" />
          <button type="button" class="text-btn" id="author-save-btn" data-i18n="save">저장</button>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:8px" data-i18n="customTypes">커스텀 항목 관리</div>
      <div class="card" id="custom-type-manage-list"></div>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:8px" data-i18n="typeOrder">항목 순서</div>
      <div class="card" id="type-order-list"></div>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:8px" data-i18n="appearance">화면</div>
      <div class="card">
        <div class="row-item">
          <div class="r-label" data-i18n="theme">테마</div>
          <div class="seg" style="width:190px" id="theme-seg">
            <button type="button" data-theme-opt="system" aria-pressed="true" data-i18n="themeAuto">자동</button>
            <button type="button" data-theme-opt="light" data-i18n="themeLight">라이트</button>
            <button type="button" data-theme-opt="dark" data-i18n="themeDark">다크</button>
          </div>
        </div>
      </div>
    </div>

    <p style="font-size:11.5px;color:var(--muted-2);text-align:center;line-height:1.5;padding:6px 10px 0" data-i18n="shareHint">
      가족 모두와 함께 쓰려면 이 페이지를 "편집 가능"으로 공유해 주세요. 기록은 이 페이지를 여는 모든 사람과 실시간으로 공유됩니다.
    </p>
  </section>

  <!-- ============ TAB BAR ============ -->
  <nav class="tabbar">
    <button type="button" class="tab-btn" data-tab="record" aria-current="true">
      <span class="tb-emoji">📋</span><span data-i18n="tabRecord">기록</span>
    </button>
    <button type="button" class="tab-btn" data-tab="memo" aria-current="false">
      <span class="tb-emoji">📝</span><span data-i18n="tabMemo">메모</span>
    </button>
    <button type="button" class="tab-btn" data-tab="pattern" aria-current="false">
      <span class="tb-emoji">🗓️</span><span data-i18n="tabPattern">패턴</span>
    </button>
    <button type="button" class="tab-btn" data-tab="stats" aria-current="false">
      <span class="tb-emoji">📊</span><span data-i18n="tabStats">통계</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings" aria-current="false">
      <span class="tb-emoji">⚙️</span><span data-i18n="tabSettings">설정</span>
    </button>
  </nav>

  <!-- ============ FULL PAGE: ENTRY DETAIL ============ -->
  <div class="fullpage" id="fp-entry">
    <div class="fp-head">
      <button type="button" class="fp-back" id="fp-entry-back">‹</button>
      <h1 id="fp-entry-title">-</h1>
      <button type="button" class="fp-delete" id="fp-entry-delete" data-i18n="delete">삭제</button>
    </div>
    <div class="fp-body" id="fp-entry-body"></div>
    <div class="fp-foot">
      <button type="button" class="btn primary" id="fp-entry-save" data-i18n="save">저장</button>
    </div>
  </div>

  <!-- ============ SHEET: CUSTOM TYPE CREATE ============ -->
  <div class="scrim" id="scrim2"></div>
  <div class="sheet" id="type-sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div class="grabber"></div>
      <button type="button" class="icon-btn" id="type-sheet-close">✕</button>
      <h2 data-i18n="newTypeTitle">새 항목 추가</h2>
      <span style="width:30px"></span>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label data-i18n="typeName">항목 이름</label>
        <input type="text" id="new-type-name" maxlength="12" />
      </div>
      <div class="field">
        <label data-i18n="typeEmoji">아이콘</label>
        <div class="emoji-pick" id="new-type-emojis"></div>
      </div>
      <div class="field">
        <label data-i18n="typeColor">색상</label>
        <div class="swatches" id="new-type-swatches"></div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn ghost" id="type-sheet-cancel" data-i18n="cancel">취소</button>
      <button type="button" class="btn primary" id="type-sheet-save" data-i18n="add">추가</button>
    </div>
  </div>

  <!-- ============ SHEET: PROFILE PICKER ============ -->
  <div class="scrim" id="scrim3"></div>
  <div class="sheet" id="profile-sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div class="grabber"></div>
      <span style="width:30px"></span>
      <h2 data-i18n="whoAmITitle">누구신가요?</h2>
      <span style="width:30px"></span>
    </div>
    <div class="sheet-body">
      <p style="font-size:13px;color:var(--muted);margin:0" data-i18n="whoAmIDesc">기록에 표시할 이름을 골라주세요. 나중에 설정에서 바꿀 수 있어요.</p>
      <div class="chip-row" id="profile-chip-row" style="padding:0"></div>
      <div class="field">
        <label data-i18n="orTypeName">직접 입력</label>
        <input type="text" id="profile-custom-input" data-i18n-ph="authorCustomPh" />
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn primary" id="profile-save-btn" data-i18n="start">시작하기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- Shared data lives on the server now (Render + Neon Postgres) and is
     fetched/mutated via /api/state and /api/mutate — see appState in the
     script below. This used to be a hidden DOM "store" synced by the Claude
     Artifact platform; that's gone now that this is a real hosted site. -->

<script>
(function(){
'use strict';

/* ================================================================
   I18N
   ================================================================ */
var I18N = {
ko: {
  memoLabel:"메모", memoEmpty:"아직 메모가 없어요", memoComposePh:"메모를 입력하세요",
  memoSubmit:"등록", memoTranslateToVi:"베트남어 번역 (선택)", memoTranslateToKo:"한국어 번역 (선택)",
  memoNoMemos:"아직 등록된 메모가 없어요.", tabMemo:"메모", typeOrder:"항목 순서",
  quickAdd:"빠른 기록", timeline:"기록", statsFeed7:"수유 통계", statsSleep7:"최근 7일 수면 통계",
  babyInfo:"아기 정보", babyNameKo:"이름 (한국어)", babyNameVi:"이름 (베트남어)", babyBirth:"태어난 날",

function t(k){ var d = I18N[state.lang] || I18N.ko; return (d[k] !== undefined) ? d[k] : (I18N.ko[k] !== undefined ? I18N.ko[k] : k); }
function locale(){ return state.lang === 'vi' ? 'vi-VN' : 'ko-KR'; }

/* an entry's author is stored as whichever preset chip (엄마/아빠/내니 or Mẹ/Bố/
   Bảo mẫu) was tapped at creation time, in whatever language was active then.
   Switching the UI language later must still show it correctly, so match the
   stored name against BOTH preset lists by position and re-render it in the
   language currently on screen. A custom/typed name (no index match) passes
   through unchanged. */
function localizeAuthorName(name){
  if (!name) return name;
  var idx = I18N.ko.authorPresets.indexOf(name);
  if (idx === -1) idx = I18N.vi.authorPresets.indexOf(name);
  if (idx === -1) return name;
  return t('authorPresets')[idx];
}
function isPresetAuthorName(name){
  if (!name) return false;
  return I18N.ko.authorPresets.indexOf(name) !== -1 || I18N.vi.authorPresets.indexOf(name) !== -1;
}

/* ================================================================
   DOM HELPERS
   ================================================================ */
function $(sel, el){ return (el||document).querySelector(sel); }
function $$(sel, el){ return Array.prototype.slice.call((el||document).querySelectorAll(sel)); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function cssEsc(s){ return String(s).replace(/["\\]/g, '\\$&'); }

/* ================================================================
   SERVER STATE + API CLIENT
   This used to be a Claude Artifact with live-doc DOM sync; it is now a
   real server-backed app (Render + Neon Postgres) so it can actually call
   a translation API server-side. All shared data lives in `appState`
   (mirroring the server's single JSON document) and every mutation goes
   through POST /api/mutate, which applies it via the same reducer on the
   server and returns the new authoritative state. A short poll picks up
   edits made by other family members/devices.
   ================================================================ */
var appState = { entries: [], active: null, customTypes: [], memos: [], typeOrder: [], profile: {} };
var appVersion = -1;

function apiGetState(){
  return fetch('/api/state').then(function(res){
    if (!res.ok) throw new Error('failed to load');
    return res.json();
  }).then(function(json){ appState = json.data; appVersion = json.version; return json; });
}
function apiMutate(type, payload){
  return fetch('/api/mutate', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ type: type, payload: payload || {} })
  }).then(function(res){
    return res.json().then(function(json){
      if (!res.ok) throw new Error(json.error || ('mutate failed: ' + type));
      return json;
    });
  }).then(function(json){ appState = json.data; appVersion = json.version; return json.result; });
}
function apiTranslate(text, target){
  return fetch('/api/translate', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text: text, target: target })
  }).then(function(res){
    return res.json().then(function(json){
      if (!res.ok) throw new Error(json.error || 'translate failed');
      return json.translated;
    });
  });
}
/* poll for edits made by other viewers; skip the tick if a mutation is
   already in flight from this tab so responses can't land out of order */
var pollBusy = false;
function pollState(){
  if (pollBusy) return;
  pollBusy = true;
  fetch('/api/state').then(function(res){ return res.json(); }).then(function(json){
    pollBusy = false;
    if (json.version !== appVersion){
      appState = json.data; appVersion = json.version;
      renderAll();
    }
  }).catch(function(){ pollBusy = false; });
}

/* ================================================================
   STORE ACCESS — thin readers over appState, kept as functions so the
   render code below (written against the old DOM-store shape) barely
   had to change.
   ================================================================ */
function readEntries(){
  return (appState.entries || []).map(function(e){
    return {
      id: e.id, type: e.type, start: e.start, end: e.end || '',
      amount: e.amount !== undefined && e.amount !== null && e.amount !== '' ? Number(e.amount) : null,
      diaper: e.diaper || '',
      temp: e.temp !== undefined && e.temp !== null && e.temp !== '' ? Number(e.temp) : null,
      note: e.note || '', author: e.author || '', sleepKind: e.sleepKind || ''
    };
  });
}
function readCustomTypes(){
  return (appState.customTypes || []).map(function(c){
    return { id: c.id, name: c.name || '', color: c.color || 'var(--c-custom)', emoji: c.emoji || '🏷️' };
  });
}
function getActive(){ return appState.active; }
function typeMeta(typeStr){
  if (!typeStr) return null;
  if (typeStr.indexOf('custom:') === 0){
    var cid = typeStr.slice(7);
    var found = readCustomTypes().filter(function(c){ return c.id===cid; })[0];
    if (found) return {id:typeStr, emoji: found.emoji, color: found.color, label: found.name, isCustom:true};
    return {id:typeStr, emoji:'🏷️', color:'var(--c-custom)', label: t('t_custom'), isCustom:true};
  }
  var b = BUILT_IN.filter(function(x){ return x.id===typeStr; })[0];
  if (!b) return null;
  var out = {}; for (var k in b) out[k]=b[k];
  out.label = t('t_' + b.id);
  return out;
}

/* ================================================================
   TYPE ORDER — a shared, user-reorderable ordering over every care
   type (built-in + custom). Stored as an ordered list of type ids in
   #type-order; anything not yet listed there (a brand-new custom type,
   or the first run before anyone has reordered) keeps its natural
   definition order and sorts after everything that IS listed.
   ================================================================ */
function readTypeOrderIds(){ return (appState.typeOrder || []).slice(); }
function allTypesInOrder(){
  var all = BUILT_IN.map(function(b){ return {id:b.id, emoji:b.emoji, color:b.color, label:t('t_'+b.id), isCustom:false}; })
    .concat(readCustomTypes().map(function(c){ return {id:'custom:'+c.id, emoji:c.emoji, color:c.color, label:c.name, isCustom:true}; }));
  var order = readTypeOrderIds();
  if (!order.length) return all;
  var pos = {}; order.forEach(function(id,i){ pos[id]=i; });
  return all.slice().sort(function(x,y){
    var px = pos[x.id], py = pos[y.id];
    if (px===undefined && py===undefined) return 0;
    if (px===undefined) return 1;
    if (py===undefined) return -1;
    return px-py;
  });
}
function moveTypeOrder(id, dir){
  var list = allTypesInOrder().map(function(x){ return x.id; });
  var i = list.indexOf(id);
  var j = i + dir;
  if (i<0 || j<0 || j>=list.length) return;
  var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
  apiMutate('setTypeOrder', { order: list }).then(function(){
    renderQuickActions();
    renderSettings();
  }).catch(function(err){ toast(err.message); });
}

/* ================================================================
   TIME / FORMAT HELPERS
   ================================================================ */
function fmtTime(iso){
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleTimeString(locale(), {hour:'2-digit', minute:'2-digit'});
}
/* numeric M/D + time — used wherever a list can mix entries from more than
   one calendar day (the memo list has no day-group headers of its own),
   so a bare time alone would be ambiguous about which day it happened */
function fmtDateTime(iso){
  if (!iso) return '';
  var d = new Date(iso);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+fmtTime(iso);
}
function toTimeValue(iso){
  if (!iso) return '';
  var d = new Date(iso);
  var p2 = function(n){ return (n<10?'0':'')+n; };
  return p2(d.getHours())+':'+p2(d.getMinutes());
}
function combineDateTime(dateSourceIso, timeStr){
  var base = dateSourceIso ? new Date(dateSourceIso) : new Date();
  var parts = (timeStr || '00:00').split(':');
  var d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Number(parts[0]||0), Number(parts[1]||0), 0, 0);
  return d.toISOString();
}
/* local YYYY-MM-DD for an <input type=date> — distinct from combineDateTime's
   ISO-source approach: parsing "YYYY-MM-DD" with `new Date()` reads it as UTC
   midnight, which can land on the wrong local day near timezone edges, so
   the date field is always read/written via these two helpers instead. */
function toDateValue(iso){
  if (!iso) iso = new Date().toISOString();
  var d = new Date(iso);
  var p2 = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function combineDateAndTime(dateStr, timeStr){
  var dp = (dateStr || toDateValue()).split('-');
  var tp = (timeStr || '00:00').split(':');
  var d = new Date(Number(dp[0]), Number(dp[1])-1, Number(dp[2]), Number(tp[0]||0), Number(tp[1]||0), 0, 0);
  return d.toISOString();
}
function fmtDur(ms){
  if (ms == null || ms < 0) ms = 0;
  var totalMin = Math.round(ms/60000);
  var h = Math.floor(totalMin/60), m = totalMin%60;
  if (h > 0) return h + t('hrShort') + ' ' + m + t('minShort');
  return m + t('minShort');
}
function fmtElapsed(ms){
  if (ms == null) return t('noRecordYet');
  if (ms < 60000) return t('justNow');
  var totalMin = Math.floor(ms/60000);
  var h = Math.floor(totalMin/60), m = totalMin%60;
  var out = h>0 ? (h+t('hrShort')+' '+m+t('minShort')) : (m+t('minShort'));
  return out + ' ' + t('agoSuffix');
}
function fmtStopwatch(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  function p2(n){ return (n<10?'0':'')+n; }
  return h>0 ? (h+':'+p2(m)+':'+p2(sec)) : (p2(m)+':'+p2(sec));
}
function dayKey(iso){
  var d = new Date(iso);
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function dayHeading(iso){
  var d = new Date(iso);
  var wd = t('weekday_short')[d.getDay()];
  if (state.lang === 'vi'){
    return d.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' (' + wd + ')';
  }
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + wd + ')';
}

/* ================================================================

   ================================================================ */
var toastTimer = null;
function toast(msg){
  var elx = document.getElementById('toast');
  elx.textContent = msg;
  elx.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ elx.classList.remove('show'); }, 1600);
}

/* baby name/birth used to be plain <input> elements inside the Artifact's
   live-doc sync region — a keystroke there was the persistence. Now they're
   ordinary inputs backed by appState.profile: applyProfileToInputs() below
   seeds their values from server state (skipping any input the user is
   actively typing in, so a poll can't clobber a live edit), and a 'change'
   listener (see wireEvents) persists edits via apiMutate('setProfile', ...). */
function applyProfileToInputs(){
  var p = appState.profile || {};
  var koEl = document.getElementById('set-baby-name-ko');
  var viEl = document.getElementById('set-baby-name-vi');
  var birthEl = document.getElementById('set-baby-birth');
  if (koEl && document.activeElement !== koEl) koEl.value = p.nameKo || '';
  if (viEl && document.activeElement !== viEl) viEl.value = p.nameVi || '';
  if (birthEl && document.activeElement !== birthEl) birthEl.value = p.birth || '';
}
function renderHeader(){
  applyProfileToInputs();
  var nameInput = document.getElementById(state.lang === 'vi' ? 'set-baby-name-vi' : 'set-baby-name-ko');
  var birthInput = document.getElementById('set-baby-birth');
  var name = (nameInput && nameInput.value.trim()) || t('babyDefaultName');
  document.getElementById('hd-name').textContent = name;
  var ageEl = document.getElementById('hd-age');
  if (birthInput && birthInput.value){
    var birth = new Date(birthInput.value + 'T00:00:00');
    var now = new Date();
    var days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(birth.getFullYear(),birth.getMonth(),birth.getDate())) / 86400000);
    /* birth day itself counts as day 1 (D+1), not day 0 */
    ageEl.textContent = t('dDay') + Math.max(1,days+1);
  } else {
    ageEl.textContent = '';
  }
  renderProfilePill();
}
function renderProfilePill(){

  pill.textContent = state.author ? localizeAuthorName(state.author) : t('whoAmI');

    slot.innerHTML =

          '<button type="button" class="aw-round" id="aw-pause" title="'+esc(t('pauseBtn'))+'"></button>' +
          '<button type="button" class="aw-round" id="aw-adjust" title="'+esc(t('adjustStart'))+'">✎</button>' +
          '<button type="button" class="aw-round confirm" id="aw-finish" title="'+esc(t('save'))+'">✓</button>' +
        '</div>' +
      '</div>' +
      '<div id="aw-adjust-panel" hidden style="margin:8px 16px 0;padding:10px 12px;border-radius:14px;background:var(--surface);"></div>';
    bar = slot.querySelector('.active-bar');

  document.getElementById('aw-pause').title = paused ? t('resumeBtn') : t('pauseBtn');
  document.getElementById('aw-name').textContent = name;
  var subParts = [fmtTime(a.start)];
  if (paused) subParts.push(t('pausedLabel'));
  if (author) subParts.push(localizeAuthorName(author));
  document.getElementById('aw-sub').textContent = subParts.join(' · ');

/* ================================================================
   DAILY AGGREGATES (shared logic used by timeline + stats)
   sleep classification: explicit sleepKind wins; otherwise a sleep
   entry starting between 19:00–06:59 counts as night, else nap.
   ================================================================ */
function classifySleep(e){
  if (e.sleepKind === 'nap' || e.sleepKind === 'night') return e.sleepKind;
  var h = new Date(e.start).getHours();
  return (h >= 20 || h < 7) ? 'night' : 'nap';
}
function entryDurationMs(e){
  if (!e.end) return 0;
  return Math.max(0, new Date(e.end) - new Date(e.start));
}
function dailyAggregate(entries){
  var byDay = {};
  entries.forEach(function(e){
    var k = dayKey(e.start);
    if (!byDay[k]) byDay[k] = {key:k, date:e.start, feedMl:0, feedCount:0, nap:0, night:0, entries:[]};
    var day = byDay[k];
    day.entries.push(e);
    if (e.type==='feed' && e.amount) { day.feedMl += e.amount; day.feedCount++; }
    if (e.type==='sleep'){
      var kind = classifySleep(e);
      var dur = entryDurationMs(e);
      if (kind==='night') day.night += dur; else day.nap += dur;
    }
  });
  return byDay;
}

/* ================================================================
   RENDER: DASHBOARD (since-last, local)
   ================================================================ */
function lastOfType(entries, matcher){
  var best = null;
  entries.forEach(function(e){
    if (!matcher(e)) return;
    var ref = e.end || e.start;
    if (!best || new Date(ref) > new Date(best.end || best.start)) best = e;
  });
  return best;
}
function renderSinceLast(){
  var entries = readEntries();
  var feed = lastOfType(entries, function(e){ return e.type==='feed'; });
  var diaper = lastOfType(entries, function(e){ return e.type==='diaper'; });
  var sleep = lastOfType(entries, function(e){ return e.type==='sleep'; });
  var now = Date.now();
  var cards = [
    {key:'since_feed', emoji:'🍼', e:feed, sub: feed ? (feed.amount!=null ? feed.amount+t('ml') : '') : ''},
    {key:'since_diaper', emoji:'🧷', e:diaper, sub: diaper ? (t(diaper.diaper==='dirty'?'dirty':(diaper.diaper==='both'?'both':'wet'))) : ''},
    {key:'since_sleep', emoji:'😴', e:sleep, sub: sleep ? (sleep.sleepKind ? t(sleep.sleepKind==='night'?'night':'nap') : '') : ''}
  ];
  var row = document.getElementById('since-row');
  row.innerHTML = cards.map(function(c){
    var ms = c.e ? (now - new Date(c.e.end || c.e.start).getTime()) : null;
    return '<div class="dash-item">' +
      '<div class="d-emoji">'+c.emoji+'</div>' +
      '<div class="d-label">'+esc(t(c.key))+'</div>' +
      '<div class="d-val">'+esc(fmtElapsed(ms))+'</div>' +
      (c.sub ? '<div class="d-sub">'+esc(c.sub)+'</div>' : '') +
    '</div>';
  }).join('');
}

/* ================================================================
   RENDER: NEXT RECOMMENDED FEED — estimated from the last feed's
   amount using a simple rule-of-thumb (40ml ≈ 1hr, 80ml ≈ 2hr, i.e.
   amount(ml) * 1.5 minutes after the last feed's start time).
   ================================================================ */
function estimateNextFeedMs(entries){
  var lastFeed = lastOfType(entries, function(e){ return e.type==='feed'; });
  if (!lastFeed || !lastFeed.start) return null;
  var amt = Number(lastFeed.amount);
  if (!amt || amt <= 0) return null;
  var gapMin = amt * 1.5; // 40ml/hr rule of thumb
  return new Date(lastFeed.start).getTime() + gapMin * 60000;
}
function renderNextFeed(){
  var box = document.getElementById('next-feed-row');
  if (!box) return;
  var nextMs = estimateNextFeedMs(readEntries());
  if (nextMs == null){ box.hidden = true; return; }
  box.hidden = false;
  var diffMin = Math.round((nextMs - Date.now()) / 60000);
  var timeStr = fmtTime(new Date(nextMs).toISOString());
  var text;
  if (diffMin > 0){
    var h = Math.floor(diffMin/60), m = diffMin%60;
    var remain = h>0 ? (h+t('hrShort')+' '+m+t('minShort')) : (m+t('minShort'));
    text = t('nextFeedValueTpl').replace('{time}', timeStr).replace('{remain}', remain);
  } else {
    text = t('nextFeedDueValueTpl').replace('{time}', timeStr);
  }
  document.getElementById('nf-text').textContent = text;
}

function renderQuickActions(){

  });
  html += '<button type="button" class="qa-btn qa-add" id="qa-add-type">' +
    '<div class="qa-ico">+</div>' +
    '<div class="qa-label">'+esc(t('addNew'))+'</div>' +
  '</button>';

  if (addBtn) addBtn.addEventListener('click', openTypeSheet);

function quickBtnHtml(typeId, label, color, emoji){
  return '<button type="button" class="qa-btn" data-type="'+esc(typeId)+'">' +
    '<div class="qa-ico" style="background:color-mix(in srgb, '+color+' 18%, var(--surface))">'+emoji+'</div>' +
    '<div class="qa-label">'+esc(label)+'</div>' +
  '</button>';
}
function wireQuickButton(btn){
  var typeId = btn.dataset.type;
  var meta = typeMeta(typeId);
  var pressTimer = null, fired = false, pressStarted = false, startX=0, startY=0;
  function cancelPress(){ clearTimeout(pressTimer); pressTimer=null; btn.classList.remove('holding'); }
  btn.addEventListener('pointerdown', function(ev){
    fired = false; pressStarted = true;
    startX = ev.clientX; startY = ev.clientY;
    btn.classList.add('holding');
    pressTimer = setTimeout(function(){
      fired = true;
      btn.classList.remove('holding');
      startStopwatch(typeId);
      if (navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
    }, 480);
  });
  btn.addEventListener('pointermove', function(ev){
    if (!pressTimer) return;
    if (Math.abs(ev.clientX-startX) > 12 || Math.abs(ev.clientY-startY) > 12) cancelPress();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(evt){
    btn.addEventListener(evt, function(){
      var wasStarted = pressStarted;
      pressStarted = false;
      cancelPress();
      if (evt==='pointerup' && wasStarted && !fired){
        quickCreate(typeId);
      }
    });
  });
}

/* Tap on a quick-action icon: create the entry immediately with sensible

function startStopwatch(typeId){

  if (a && a.type){ toast(t('alreadyActive')); return; }
  var meta = typeMeta(typeId);
  var name = meta ? meta.label : '';
  apiMutate('startActive', { type: typeId, name: name, author: state.author }).then(function(){
