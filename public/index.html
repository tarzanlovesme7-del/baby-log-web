/* ================================================================
   RENDER: TIMELINE (local)
   ================================================================ */
function renderTimeline(){
  var container = document.getElementById('timeline');
  var entries = readEntries().slice().sort(function(a,b){ return new Date(b.start) - new Date(a.start); });
  var a = getActive();
  var activeRunning = !!(a && a.type);
  var nowIso = new Date().toISOString();
  var todayK = dayKey(nowIso);

  if (!entries.length && !activeRunning){
    container.innerHTML = '<div class="empty-note">'+esc(t('emptyTimeline'))+'</div>';
    return;
  }
  var agg = dailyAggregate(entries);
  /* the running stopwatch lives inside today's group, right under the date —
     synthesize an (otherwise empty) today group so it has somewhere to sit */
  if (activeRunning && !agg[todayK]){
    agg[todayK] = {key:todayK, date:nowIso, feedMl:0, feedCount:0, nap:0, night:0, entries:[]};
  }
  var order = Object.keys(agg).sort(function(x,y){ return new Date(agg[y].date) - new Date(agg[x].date); });
  var html = '';
  order.forEach(function(k){
    var day = agg[k];
    var dayEntries = day.entries.slice().sort(function(x,y){ return new Date(y.start)-new Date(x.start); });
    html += '<div class="day-group">';
    html += '<div class="day-head"><div class="d-title">'+esc(dayHeading(day.date))+'</div><div class="day-totals">';
    html += '<span>'+esc(t('totalFeedDay'))+' <b>'+day.feedMl+t('ml')+'</b></span>';
    html += '<span>'+esc(t('totalNap'))+' <b>'+fmtDur(day.nap)+'</b></span>';
    html += '<span>'+esc(t('totalNight'))+' <b>'+fmtDur(day.night)+'</b></span>';
    html += '</div></div>';
    if (activeRunning && k === todayK){ html += '<div id="active-bar-slot"></div>'; }
    dayEntries.forEach(function(e){ html += entryRowHtml(e); });
    html += '</div>';
  });
  container.innerHTML = html;
  $$('.entry-swipe', container).forEach(function(wrap){ wireEntrySwipe(wrap); });
}
function entryRowHtml(e){
  var meta = typeMeta(e.type);
  if (!meta) return '';
  var title = meta.label;
  var subParts = [];
  if (e.type==='feed'){
    if (e.amount!=null) subParts.push(e.amount+t('ml'));
  } else if (e.type==='diaper'){
    subParts.push(t(e.diaper==='dirty'?'dirty':(e.diaper==='both'?'both':'wet')));
  } else if (e.type==='sleep'){
    subParts.push(t(classifySleep(e)==='night'?'night':'nap'));
  } else if (e.type==='temp'){
    if (e.temp!=null) subParts.push(e.temp+t('celsius'));
  }
  /* every type shows how long it ran the moment the end time moves past the start */
  if (e.end && e.end !== e.start) subParts.push(fmtDur(entryDurationMs(e)));
  if (e.note) subParts.push(e.note);
  var timeStr = fmtTime(e.start) + ((e.end && e.end !== e.start) ? ('~'+fmtTime(e.end)) : '');
  return '<div class="entry-swipe" data-id="'+esc(e.id)+'">' +
    '<div class="entry-delete-bg" data-swipe-del="'+esc(e.id)+'"><span>'+esc(t('deleteSwipeLabel'))+'</span></div>' +
    '<button type="button" class="entry-row" data-id="'+esc(e.id)+'">' +
      '<div class="e-dot" style="background:color-mix(in srgb, '+meta.color+' 18%, var(--surface-2))">'+meta.emoji+'</div>' +
      '<div class="e-main"><div class="e-title">'+esc(title)+'</div>' +
      (subParts.length ? '<div class="e-sub">'+esc(subParts.join(' · '))+'</div>' : '') + '</div>' +
      '<div class="e-time">'+esc(timeStr)+(e.author?('<span class="e-author">'+esc(localizeAuthorName(e.author))+'</span>'):'')+'</div>' +
    '</button>' +
  '</div>';
}

/* ---- swipe-to-delete: pointer-based drag on .entry-row, revealing the
   .entry-delete-bg layer behind it. No external gesture library (CSP). ---- */
function wireEntrySwipe(wrap){
  var row = $('.entry-row', wrap);
  if (!row) return;
  var THRESH = 56;      /* px dragged left before the delete bg is considered "open" */
  var TAPMAX = 6;       /* px of movement still counted as a tap */
  var dragging = false, startX = 0, startY = 0, dx = 0, axis = null, opened = false;

  row.addEventListener('pointerdown', function(ev){
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    dragging = true; axis = null; dx = 0;
    startX = ev.clientX; startY = ev.clientY;
    row.style.transition = 'none';
  });
  row.addEventListener('pointermove', function(ev){
    if (!dragging) return;
    var mx = ev.clientX - startX, my = ev.clientY - startY;
    if (axis === null){
      if (Math.abs(mx) < TAPMAX && Math.abs(my) < TAPMAX) return;
      axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
      if (axis === 'x' && row.setPointerCapture){ try{ row.setPointerCapture(ev.pointerId); }catch(e){} }
      if (axis === 'x') wrap.classList.add('revealed');
    }
    if (axis !== 'x') return;
    ev.preventDefault();
    dx = Math.min(0, Math.max(-88, mx + (opened ? -72 : 0)));
    row.style.transform = 'translateX('+dx+'px)';
  });
  function finish(ev){
    if (!dragging) return;
    dragging = false;
    row.style.transition = '';
    if (axis === 'x'){
      if (dx <= -THRESH){ row.style.transform = 'translateX(-72px)'; opened = true; }
      else { row.style.transform = ''; opened = false; wrap.classList.remove('revealed'); }
    } else if (axis === null){
      /* a genuine tap: no meaningful movement on either axis */
      if (opened){ row.style.transform = ''; opened = false; wrap.classList.remove('revealed'); }
      else { openEntryDetail(row.dataset.id); }
    }
    axis = null;
  }
  row.addEventListener('pointerup', finish);
  row.addEventListener('pointercancel', finish);

  var delBg = $('.entry-delete-bg', wrap);
  if (delBg){
    delBg.addEventListener('click', function(){
      deleteEntryDirect(delBg.dataset.swipeDel);
    });
  }
}
function deleteEntryDirect(id){
  apiMutate('deleteEntry', { id: id }).then(function(){
    renderAll();
    toast(t('deletedToast'));
  }).catch(function(err){ toast(err.message); });
}

/* ================================================================
   RENDER: STATS (local)
   ================================================================ */
function renderStats(){
  var entries = readEntries();
  var now = new Date();
  var feedDays = state.statsFeedDays || 7;

  /* -------- feed stats: range-toggleable (7/14/30 days) -------- */
  var days = [];
  for (var i=feedDays-1;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
    days.push(d);
  }
  var agg = dailyAggregate(entries);
  var feedTotals = [], feedCounts=[];
  days.forEach(function(d){
    var k = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    var a = agg[k];
    feedTotals.push(a ? a.feedMl : 0);
    feedCounts.push(a ? a.feedCount : 0);
  });
  var totalMl = feedTotals.reduce(function(a,b){return a+b;},0);
  var totalCount = feedCounts.reduce(function(a,b){return a+b;},0);
  var avgPerFeed = totalCount ? Math.round(totalMl/totalCount) : 0;
  var avgFeedsPerDay = (totalCount/feedDays).toFixed(1);

  document.getElementById('stat-tiles').innerHTML =
    statTile(t('avgPerFeed'), avgPerFeed+' <small>'+t('ml')+'</small>') +
    statTile(t('avgFeedsPerDay'), avgFeedsPerDay+' <small>'+ (state.lang==='vi'?'lần/ngày':'회/일') +'</small>');

  /* -------- sleep stats: fixed at 7 days -------- */
  var sleepDays = [];
  for (var j=6;j>=0;j--){
    sleepDays.push(new Date(now.getFullYear(), now.getMonth(), now.getDate()-j));
  }
  var napTotals=[], nightTotals=[];
  sleepDays.forEach(function(d){
    var k = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    var a = agg[k];
    napTotals.push(a ? a.nap : 0);
    nightTotals.push(a ? a.night : 0);
  });
  var avgNap = napTotals.reduce(function(a,b){return a+b;},0)/7;
  var avgNight = nightTotals.reduce(function(a,b){return a+b;},0)/7;

  document.getElementById('stat-sleep-tiles').innerHTML =
    statTile(t('avgNap'), '<span style="font-size:17px">'+fmtDur(avgNap)+'</span>') +
    statTile(t('avgNight'), '<span style="font-size:17px">'+fmtDur(avgNight)+'</span>');

  /* -------- feed bar chart: thin labels + date-vs-weekday format for longer ranges -------- */
  var maxMl = Math.max(1, feedTotals.reduce(function(a,b){return Math.max(a,b);},0));
  var labelEvery = feedDays > 20 ? 5 : (feedDays > 9 ? 2 : 1);
  document.getElementById('stat-bars').innerHTML = days.map(function(d,i){
    var h = Math.round((feedTotals[i]/maxMl)*94)+4;
    var showLabel = (i === days.length-1) || (i % labelEvery === 0);
    var lbl = '';
    if (showLabel){
      lbl = feedDays > 9 ? (d.getMonth()+1)+'/'+d.getDate() : t('weekday_short')[d.getDay()];
    }
    return '<div class="bar-col"><div class="bar-val">'+(feedTotals[i]||'')+'</div><div class="bar" style="height:'+h+'px"></div><div class="bar-lbl">'+esc(lbl)+'</div></div>';
  }).join('');

  renderPoopChart(entries);
}

/* ================================================================
   POOP-INTERVAL CHART — a line+area chart of the gap between each
   dirty/both diaper change (in day units) plus a "지금/Bây giờ" point
   for the gap since the last one, with a day-grouped raw list below.
   Modeled directly on a phone Health app's record-interval screen.
   ================================================================ */
function renderPoopChart(entries){
  var wrap = document.getElementById('poop-chart-wrap');
  var listBox = document.getElementById('poop-day-list');
  var badge = document.getElementById('poop-recent-badge');
  if (!wrap || !listBox) return;

  var poopEntries = entries
    .filter(function(e){ return e.type==='diaper' && (e.diaper==='dirty' || e.diaper==='both'); })
    .sort(function(a,b){ return new Date(a.start) - new Date(b.start); });
  var RECENT_N = 7;
  var recent = poopEntries.slice(-RECENT_N);

  if (badge) badge.textContent = recent.length ? t('poopRecentTpl').replace('{n}', recent.length) : '';

  if (recent.length < 2){
    wrap.innerHTML = '<div class="empty-note" style="padding:30px 16px;">'+esc(t('notEnoughData'))+'</div>';
    listBox.innerHTML = '';
    return;
  }

  var now = new Date();
  var points = [];
  for (var i=1;i<recent.length;i++){
    points.push({ t: new Date(recent[i].start), gapMs: new Date(recent[i].start) - new Date(recent[i-1].start), isNow:false });
  }
  points.push({ t: now, gapMs: now - new Date(recent[recent.length-1].start), isNow:true });

  wrap.innerHTML = buildPoopChartSvg(points);

  var byDay = {}, order = [];
  recent.slice().sort(function(a,b){ return new Date(b.start) - new Date(a.start); }).forEach(function(e){
    var k = dayKey(e.start);
    if (!byDay[k]){ byDay[k] = []; order.push(k); }
    byDay[k].push(e);
  });
  listBox.innerHTML = order.map(function(k){
    var dayEntries = byDay[k];
    return '<div class="poop-day-group">' +
      '<div class="poop-day-title">'+esc(dayHeading(dayEntries[0].start))+'</div>' +
      dayEntries.map(function(e){
        return '<div class="poop-day-row">' +
          '<span class="poop-day-time">'+esc(fmtTime(e.start))+'</span>' +
          '<span class="poop-day-kind">'+esc(t(e.diaper==='dirty'?'dirty':'both'))+'</span>' +
          (e.note ? '<span class="poop-day-note">'+esc(e.note)+'</span>' : '') +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');
}
function fmtDurDayHour(ms){
  if (ms == null || ms < 0) ms = 0;
  var totalMin = Math.round(ms/60000);
  var d = Math.floor(totalMin/1440);
  var h = Math.floor((totalMin%1440)/60);
  var m = totalMin%60;
  if (d > 0) return d+t('dayShort')+' '+h+t('hrShort');
  if (h > 0) return h+t('hrShort')+' '+m+t('minShort');
  return m+t('minShort');
}
function fmtMonthDay(d){ return (d.getMonth()+1)+'/'+(d.getDate()<10?'0':'')+d.getDate(); }
function buildPoopChartSvg(points){
  var maxGapDays = Math.max.apply(null, points.map(function(p){ return p.gapMs/86400000; }));
  var yMaxDays = Math.max(2, Math.ceil(maxGapDays) + 1);
  var W = 340, H = 190, padL = 26, padR = 8, padT = 26, padB = 32;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var n = points.length;
  var xAt = function(i){ return n > 1 ? padL + (plotW * i/(n-1)) : padL + plotW/2; };
  var yAt = function(days){ return padT + plotH - (Math.min(days, yMaxDays)/yMaxDays) * plotH; };
  var coords = points.map(function(p,i){ return { x: xAt(i), y: yAt(p.gapMs/86400000) }; });

  var linePath = coords.map(function(c,i){ return (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1); }).join(' ');
  var areaPath = linePath +
    ' L'+coords[coords.length-1].x.toFixed(1)+','+(padT+plotH) +
    ' L'+coords[0].x.toFixed(1)+','+(padT+plotH)+' Z';

  var gridLines = '';
  for (var lvl=0; lvl<=yMaxDays; lvl++){
    var gy = yAt(lvl);
    var lbl = lvl===0 ? ('0'+t('minShort')) : (lvl+t('dayShort'));
    gridLines += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" class="poop-grid-line" />';
    gridLines += '<text x="'+(padL-6)+'" y="'+(gy+3).toFixed(1)+'" class="poop-axis-y" text-anchor="end">'+esc(lbl)+'</text>';
  }

  /* the first/last points sit right at the plot's left/right edge — centering
     their labels there would run them into the y-axis text (left) or off the
     canvas (right), so those two ends anchor outward instead of centering */
  var dots = '', valueLabels = '', xLabels = '';
  points.forEach(function(p,i){
    var c = coords[i];
    var anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    var lblX = i===0 ? c.x+3 : (i===n-1 ? c.x-3 : c.x);
    dots += '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="3.5" class="poop-dot" />';
    valueLabels += '<text x="'+lblX.toFixed(1)+'" y="'+(c.y-9).toFixed(1)+'" class="poop-value-lbl" text-anchor="'+anchor+'">'+esc(fmtDurDayHour(p.gapMs))+'</text>';
    var lines = p.isNow ? [t('nowBtn')] : [fmtMonthDay(p.t), toTimeValue(p.t.toISOString())];
    xLabels += '<text x="'+lblX.toFixed(1)+'" y="'+(H-padB+13)+'" class="poop-axis-x" text-anchor="'+anchor+'">' +
      lines.map(function(ln,li){ return '<tspan x="'+lblX.toFixed(1)+'" dy="'+(li===0?0:10)+'">'+esc(ln)+'</tspan>'; }).join('') +
    '</text>';
  });

  return '<svg viewBox="0 0 '+W+' '+H+'" class="poop-chart-svg" role="img" aria-label="'+esc(t('poopStats'))+'">' +
    '<defs><linearGradient id="poopFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--c-diaper)" stop-opacity="0.35" />' +
      '<stop offset="100%" stop-color="var(--c-diaper)" stop-opacity="0" />' +
    '</linearGradient></defs>' +
    gridLines +
    '<path d="'+areaPath+'" fill="url(#poopFill)" stroke="none" />' +
    '<path d="'+linePath+'" class="poop-line" />' +
    dots + valueLabels + xLabels +
  '</svg>';
}
function statTile(label, valHtml){
  return '<div class="card stat-tile"><div class="st-label">'+esc(label)+'</div><div class="st-val">'+valHtml+'</div></div>';
}

/* ================================================================
   RENDER: PATTERN (weekly, local) — last 7 days, one column per day,
   time-of-day (0-24h) on the vertical axis. Sleep draws as a flat
   start~end stripe (clipped/split across the midnight boundary so an
   overnight sleep shows on both columns); feed draws as a plain-color
   stripe with no icon (it repeats too often to stay legible); every
   other type draws its bare emoji floating on top of its own stripe —
   no pill/circle shapes anywhere, all muted/pastel tints of the type
   color rather than the saturated brand hue.
   ================================================================ */
/* a muted/pastel tint of the type's brand color — blended toward the
   track background rather than white, so it stays correct in dark mode
   too — for the flat stacked-bar-style marks. */
function patternTint(color){ return 'color-mix(in srgb, '+color+' 46%, var(--surface-2))'; }

/* diaper is the one type with a mixed rule: a plain wet change is common
   enough that an icon on every one would be noise (same reasoning as
   feed), but a dirty/both change is exactly the kind of thing worth
   spotting at a glance, so only THOSE get the icon. Every other
   non-feed/sleep type always gets its icon. */
function markHasEmoji(e){
  if (e.type === 'feed' || e.type === 'sleep') return false;
  if (e.type === 'diaper') return e.diaper === 'dirty' || e.diaper === 'both';
  return true;
}

function renderPattern(){
  var colsBox = document.getElementById('pattern-cols');
  var legendBox = document.getElementById('pattern-legend');
  var cardEl = document.getElementById('pattern-chart-card');
  var emptyEl = document.getElementById('pattern-empty');
  if (!colsBox) return;

  var entries = readEntries();
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var DAY_MS = 86400000;
  var typeOrder = allTypesInOrder().map(function(x){ return x.id; });
  var usedTypes = {};
  var anyMark = false;
  var colsHtml = '';

  for (var i = 6; i >= 0; i--){
    var dStart = new Date(todayStart.getTime() - i*DAY_MS);
    var dStartMs = dStart.getTime(), dEndMs = dStartMs + DAY_MS;
    // collected with a priority rank, then painted lowest-priority-first so
    // that when two entries land at (nearly) the same time, the one
    // earlier in the default item order ends up on top
    var dayMarks = [];

    entries.forEach(function(e){
      var meta = typeMeta(e.type);
      if (!meta) return;
      var s = new Date(e.start).getTime();
      if (isNaN(s)) return;
      var tint = patternTint(meta.color);
      var rank = typeOrder.indexOf(e.type);
      if (rank < 0) rank = typeOrder.length;
      if (e.type === 'sleep'){
        var en = e.end ? new Date(e.end).getTime() : s;
        if (en < s) en = s;
        var os = Math.max(s, dStartMs), oe = Math.min(en, dEndMs);
        if (oe <= os) return;
        var topPct = (os - dStartMs)/DAY_MS*100;
        var hPct = Math.max((oe-os)/DAY_MS*100, 0.6);
        usedTypes[e.type] = meta; anyMark = true;
        dayMarks.push({ rank: rank, html: '<span class="pattern-mark-band" style="top:'+topPct.toFixed(2)+'%;height:'+hPct.toFixed(2)+'%;background:'+tint+'" title="'+esc(meta.label)+'"></span>' });
      } else {
        if (s < dStartMs || s >= dEndMs) return;
        var pct = (s - dStartMs)/DAY_MS*100;
        usedTypes[e.type] = meta; anyMark = true;
        var titleAttr = ' title="'+esc(meta.label)+' '+esc(fmtTime(e.start))+'"';
        var html = '<span class="pattern-mark-band is-point" style="top:'+pct.toFixed(2)+'%;background:'+tint+'"'+titleAttr+'></span>';
        if (markHasEmoji(e)){
          html += '<span class="pattern-mark-emoji" style="top:'+pct.toFixed(2)+'%"'+titleAttr+'>'+meta.emoji+'</span>';
        }
        dayMarks.push({ rank: rank, html: html });
      }
    });

    dayMarks.sort(function(a, b){ return b.rank - a.rank; }); // lowest priority (highest rank number) painted first
    var marks = ['<span class="pattern-grid-line-h" style="top:25%"></span>',
                 '<span class="pattern-grid-line-h" style="top:50%"></span>',
                 '<span class="pattern-grid-line-h" style="top:75%"></span>']
      .concat(dayMarks.map(function(m){ return m.html; }));

    colsHtml += '<div class="pattern-col'+(i===0 ? ' today' : '')+'">' +
      '<div class="pattern-col-track">'+marks.join('')+'</div>' +
      '<div class="pattern-col-label">'+esc(t('weekday_short')[dStart.getDay()])+
        '<span class="pattern-col-date">'+(dStart.getMonth()+1)+'/'+dStart.getDate()+'</span></div>' +
    '</div>';
  }
  colsBox.innerHTML = colsHtml;
  colsBox.scrollLeft = colsBox.scrollWidth; // open already scrolled to today, at the right edge

  var typeIds = Object.keys(usedTypes).sort(function(a,b){ return typeOrder.indexOf(a)-typeOrder.indexOf(b); });
  legendBox.innerHTML = typeIds.map(function(id){
    var m = usedTypes[id];
    /* legend mirrors the chart's own split: feed/sleep are color-only there,
       so they get a plain swatch here too; every other type shows its icon
       ALONE (no color swatch behind it) so color and icon never sit on top
       of one another in the key. */
    if (id === 'feed' || id === 'sleep'){
      return '<span class="pattern-legend-item"><span class="pattern-legend-swatch" style="background:'+patternTint(m.color)+'"></span>'+esc(m.label)+'</span>';
    }
    return '<span class="pattern-legend-item"><span class="pattern-legend-emoji-only">'+m.emoji+'</span>'+esc(m.label)+'</span>';
  }).join('');

  if (cardEl) cardEl.hidden = !anyMark;
  legendBox.hidden = !anyMark;
  if (emptyEl) emptyEl.hidden = anyMark;
}

function buildEntryFields(meta, e){
  var html = '';

  /* every type gets both start + end now; end defaults equal to start
     (see quickCreate/finishActive) and the user can move it independently.
     the date is edited separately from the time-of-day fields. */
  html += '<div class="field"><label>'+esc(t('dateLabel'))+'</label><input type="date" id="f-date" value="'+toDateValue(e.start)+'" /></div>';
  html += '<div class="time-row">' +
    '<div class="field"><label>'+esc(t('startTime'))+'</label><input type="time" id="f-start" value="'+toTimeValue(e.start)+'" /></div>' +
    '<div class="time-sep">–</div>' +
    '<div class="field"><label>'+esc(t('endTime'))+'</label><input type="time" id="f-end" value="'+toTimeValue(e.end||e.start)+'" /></div>' +
  '</div>';

  if (meta.hasAmount){
    html += '<div class="field"><label>'+esc(t('amount'))+'</label>' +
      '<div class="amount-row">' +
        '<button type="button" class="amt-step" data-amt-step="-10">−</button>' +
        '<input type="number" id="f-amount" value="'+esc(e.amount)+'" min="0" max="500" step="5" />' +
        '<button type="button" class="amt-step" data-amt-step="10">+</button>' +
      '</div>' +
      '<input type="range" id="f-amount-range" min="0" max="300" step="5" value="'+esc(e.amount||0)+'" style="margin-top:10px" /></div>';
  }
  if (meta.hasDiaperKind){
    html += '<div class="field"><label>'+esc(t('diaperKind'))+'</label><div class="seg" id="f-diaper">' +
      ['wet','dirty','both'].map(function(k){ return '<button type="button" data-val="'+k+'" aria-pressed="'+(e.diaper===k)+'">'+esc(t(k))+'</button>'; }).join('') +
      '</div></div>';
  }
  if (meta.hasSleepKind){
    html += '<div class="field"><label>'+esc(t('sleepKind'))+'</label><div class="seg" id="f-sleep">' +
      ['auto','nap','night'].map(function(k){ return '<button type="button" data-val="'+k+'" aria-pressed="'+((e.sleepKind||'auto')===k)+'">'+esc(t(k))+'</button>'; }).join('') +
      '</div></div>';
  }
  if (meta.hasTemp){
    html += '<div class="field"><label>'+esc(t('temperature'))+'</label>' +
      '<input type="number" id="f-temp" value="'+esc(e.temp)+'" min="30" max="43" step="0.1" /></div>';
  }
  var noteLabel = meta.noteKey ? t(meta.noteKey) : t('note');
  html += '<div class="field"><label>'+esc(noteLabel)+'</label>' +
    '<input type="text" id="f-note" value="'+esc(e.note)+'" maxlength="80" /></div>';

  html += '<div class="field"><label>'+esc(t('author'))+'</label><div class="chip-row" id="f-author" style="padding:0">' +
    t('authorPresets').map(function(n){ return '<button type="button" class="chip" data-author="'+esc(n)+'" aria-pressed="'+(localizeAuthorName(e.author)===n)+'">'+esc(n)+'</button>'; }).join('') +
  '</div><input type="text" id="f-author-custom" value="'+ (isPresetAuthorName(e.author) ? '' : esc(e.author)) +'" placeholder="'+esc(t('authorCustomPh'))+'" style="margin-top:8px" /></div>';

  return html;
}

function wireEntryFields(meta){
  var range = document.getElementById('f-amount-range'), num = document.getElementById('f-amount');
  if (range && num){
    range.addEventListener('input', function(){ num.value = range.value; });
    num.addEventListener('input', function(){ range.value = num.value; });
    $$('.amt-step').forEach(function(b){
      b.addEventListener('click', function(){
        num.value = Math.max(0, (Number(num.value)||0) + Number(b.dataset.amtStep));
        range.value = num.value;
      });
    });
  }
  ['f-diaper','f-sleep'].forEach(function(segId){
    var seg = document.getElementById(segId);
    if (!seg) return;
    $$('button', seg).forEach(function(b){
      b.addEventListener('click', function(){
        $$('button', seg).forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      });
    });
  });
  var authorBox = document.getElementById('f-author');
  $$('.chip', authorBox).forEach(function(chip){
    chip.addEventListener('click', function(){
      $$('.chip', authorBox).forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      chip.setAttribute('aria-pressed','true');
      document.getElementById('f-author-custom').value = '';
    });
  });
}

function saveEntryDetail(){
  var raw = (appState.entries || []).filter(function(x){ return x.id === state.entryId; })[0];
  if (!raw) return;
  var meta = typeMeta(raw.type);
  if (!meta) return;

  var dateVal = document.getElementById('f-date') ? document.getElementById('f-date').value : toDateValue(raw.start);
  var startTimeVal = document.getElementById('f-start').value;
  var newStart = combineDateAndTime(dateVal, startTimeVal);
  var endTimeVal = document.getElementById('f-end') ? document.getElementById('f-end').value : startTimeVal;
  var newEnd = combineDateAndTime(dateVal, endTimeVal || startTimeVal);

  var payload = { id: state.entryId, start: newStart, end: newEnd };
  var amountEl = document.getElementById('f-amount');
  if (amountEl) payload.amount = Number(amountEl.value);
  var diaperSeg = document.getElementById('f-diaper');
  if (diaperSeg){ var dp = diaperSeg.querySelector('[aria-pressed="true"]'); payload.diaper = dp?dp.dataset.val:'wet'; }
  var sleepSeg = document.getElementById('f-sleep');
  if (sleepSeg){ var sp = sleepSeg.querySelector('[aria-pressed="true"]'); var sk=(sp?sp.dataset.val:'auto'); payload.sleepKind = (sk==='auto')?'':sk; }
  var tempEl = document.getElementById('f-temp');
  if (tempEl) payload.temp = Number(tempEl.value);
  payload.note = document.getElementById('f-note').value.trim();
  var authorCustom = document.getElementById('f-author-custom').value.trim();
  var authorChip = $('.chip[aria-pressed="true"]', document.getElementById('f-author'));
  var authorVal = authorCustom || (authorChip ? authorChip.dataset.author : '') || state.author;
  payload.author = authorVal;
  if (authorVal && authorVal !== state.author){ state.author = authorVal; localStorage.setItem(LS_AUTHOR, authorVal); }

  apiMutate('updateEntry', payload).then(function(){
    closeEntryDetail();
    renderAll();
    toast(t('savedToast'));
  }).catch(function(err){ toast(err.message); });
}
function deleteEntryDetail(){
  apiMutate('deleteEntry', { id: state.entryId }).then(function(){
    closeEntryDetail();
    renderAll();
    toast(t('deletedToast'));
  }).catch(function(err){ toast(err.message); });
}

/* ================================================================
   FULL PAGE: ANNOUNCEMENT
   ================================================================ */
function openFullpage(id){ document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden'; }
function closeFullpage(id){ document.getElementById(id).classList.remove('show'); document.body.style.overflow=''; }

/* ================================================================
   MEMO — a shared list. Language detection is a plain Unicode-range check
   (Hangul vs Vietnamese diacritics). Translation is REAL now: the server
   calls a translation API (see server/translate.js) — this is the whole
   reason this app moved off the Claude Artifact platform, whose CSP only
   allowed outbound requests to Google Fonts and could never reach a
   translation API from client-side code.
   ================================================================ */
function readMemos(){
  return (appState.memos || []).map(function(m){
    return {
      id: m.id, text: m.text || '', lang: m.lang || 'other',
      translated: m.translation || '', author: m.author || '', time: m.ts || ''
    };
  }).sort(function(a,b){ return new Date(b.time) - new Date(a.time); });
}
var HANGUL_RE = /[가-힣]/;
var VI_DIACRITIC_RE = /[àáâãèéêìíòóôõùúăđĩũơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i;
function detectLang(text){
  if (HANGUL_RE.test(text)) return 'ko';
  if (VI_DIACRITIC_RE.test(text)) return 'vi';
  return 'other';
}
function updateMemoPreview(){
  var preview = document.getElementById('memo-preview');
  if (!preview) return;
  var latest = readMemos()[0];
  preview.textContent = latest ? latest.text.split('\n')[0] : t('memoEmpty');
}
function renderMemoList(){
  var box = document.getElementById('memo-list');
  if (!box) return;
  var memos = readMemos();
  if (!memos.length){
    box.innerHTML = '<div class="empty-note">'+esc(t('memoNoMemos'))+'</div>';
    return;
  }
  box.innerHTML = memos.map(function(m){
    var tag = m.lang === 'ko' ? '🇰🇷 KO' : (m.lang === 'vi' ? '🇻🇳 VI' : '');
    var tagClass = m.lang === 'ko' ? 'lang-ko' : (m.lang === 'vi' ? 'lang-vi' : '');
    return '<div class="memo-row">' +
      '<div class="m-text">'+esc(m.text)+'</div>' +
      (m.translated ? '<div class="m-translated">'+esc(m.translated)+'</div>' : '') +
      '<div class="m-meta">' +
        '<span>'+esc([localizeAuthorName(m.author), fmtDateTime(m.time)].filter(Boolean).join(' · '))+'</span>' +
        '<span style="display:flex;align-items:center;gap:8px;">' +
          (tag ? '<span class="m-lang-tag '+tagClass+'">'+tag+'</span>' : '') +
          '<button type="button" class="text-btn danger-btn" data-del-memo="'+esc(m.id)+'" style="padding:0;">'+esc(t('delete'))+'</button>' +
        '</span>' +
      '</div>' +
    '</div>';
  }).join('');
  $$('[data-del-memo]', box).forEach(function(btn){
    btn.addEventListener('click', function(){
      apiMutate('deleteMemo', { id: btn.dataset.delMemo }).then(function(){
        renderMemoList(); updateMemoPreview();
        toast(t('deletedToast'));
      }).catch(function(err){ toast(err.message); });
    });
  });
}
/* live preview of the auto-translation while composing, debounced so every
   keystroke doesn't fire a request — the same translation is reused at
   submit time if the text hasn't changed since. */
var memoTranslateDebounce = null;
var memoTranslateCache = { text: '', lang: '', translation: '' };
function updateMemoComposeTranslateField(){
  var textEl = document.getElementById('memo-compose-text');
  var wrap = document.getElementById('memo-compose-translate-wrap');
  var label = document.getElementById('memo-compose-translate-label');
  var preview = document.getElementById('memo-compose-translate-preview');
  if (!textEl || !wrap || !label || !preview) return;
  var text = textEl.value.trim();
  var lang = detectLang(text);
  clearTimeout(memoTranslateDebounce);
  if (lang !== 'ko' && lang !== 'vi'){ wrap.hidden = true; return; }
  wrap.hidden = false;
  label.textContent = lang === 'ko' ? t('memoTranslateToVi') : t('memoTranslateToKo');
  if (!text){ preview.textContent = ''; return; }
  preview.textContent = t('translating');
  memoTranslateDebounce = setTimeout(function(){
    var target = lang === 'ko' ? 'vi' : 'ko';
    apiTranslate(text, target).then(function(translated){
      memoTranslateCache = { text: text, lang: lang, translation: translated };
      if (document.getElementById('memo-compose-text').value.trim() === text){
        preview.textContent = translated;
      }
    }).catch(function(){ preview.textContent = ''; });
  }, 500);
}
function submitMemo(){
  var textEl = document.getElementById('memo-compose-text');
  var text = textEl.value.trim();
  if (!text) return;
  var lang = detectLang(text);
  var submitBtn = document.getElementById('memo-compose-submit');
  submitBtn.disabled = true;

  var translationPromise;
  if (lang === 'ko' || lang === 'vi'){
    if (memoTranslateCache.text === text && memoTranslateCache.lang === lang){
      translationPromise = Promise.resolve(memoTranslateCache.translation);
    } else {
      translationPromise = apiTranslate(text, lang === 'ko' ? 'vi' : 'ko').catch(function(){ return ''; });
    }
  } else {
    translationPromise = Promise.resolve('');
  }

  translationPromise
    .then(function(translation){
      return apiMutate('addMemo', { text: text, lang: lang, translation: translation, author: state.author });
    })
    .then(function(){
      textEl.value = '';
      document.getElementById('memo-compose-translate-preview').textContent = '';
      document.getElementById('memo-compose-translate-wrap').hidden = true;
      memoTranslateCache = { text: '', lang: '', translation: '' };
      renderMemoList();
      updateMemoPreview();
      toast(t('savedToast'));
      submitBtn.disabled = false;
    })
    .catch(function(err){
      toast(err.message || 'error');
      submitBtn.disabled = false;
    });
}

/* ================================================================
   SHEET: open/close plumbing (small quick-pick flows only)
   ================================================================ */
function openSheet(id){
  document.getElementById(id==='type-sheet'?'scrim2':'scrim3').classList.add('show');
  document.getElementById(id).classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet(id){
  document.getElementById(id==='type-sheet'?'scrim2':'scrim3').classList.remove('show');
  document.getElementById(id).classList.remove('show');
  document.body.style.overflow = '';
  // a focused control inside the sheet stays focused while translated off-screen, which can
  // otherwise drag other scroll containers (e.g. the quick-actions row) into view — release it.
  if (document.activeElement && document.getElementById(id).contains(document.activeElement)){
    document.activeElement.blur();
  }
}

/* ================================================================
   TYPE SHEET — create a reusable custom care type
   ================================================================ */
var pickedSwatch = SWATCHES[0], pickedEmoji = EMOJI_CHOICES[0];
function openTypeSheet(){
  document.getElementById('new-type-name').value = '';
  pickedSwatch = SWATCHES[Math.floor(Math.random()*SWATCHES.length)];
  pickedEmoji = EMOJI_CHOICES[Math.floor(Math.random()*EMOJI_CHOICES.length)];
  document.getElementById('new-type-swatches').innerHTML = SWATCHES.map(function(c){
    return '<button type="button" class="swatch" style="background:'+c+'" data-swatch="'+c+'" aria-pressed="'+(c===pickedSwatch)+'"></button>';
  }).join('');
  document.getElementById('new-type-emojis').innerHTML = EMOJI_CHOICES.map(function(em){
    return '<button type="button" data-emoji="'+em+'" aria-pressed="'+(em===pickedEmoji)+'">'+em+'</button>';
  }).join('');
  $$('.swatch', document.getElementById('new-type-swatches')).forEach(function(b){
    b.addEventListener('click', function(){
      pickedSwatch = b.dataset.swatch;
      $$('.swatch', document.getElementById('new-type-swatches')).forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    });
  });
  $$('button', document.getElementById('new-type-emojis')).forEach(function(b){
    b.addEventListener('click', function(){
      pickedEmoji = b.dataset.emoji;
      $$('button', document.getElementById('new-type-emojis')).forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    });
  });
  openSheet('type-sheet');
}
function saveTypeSheet(){
  var name = document.getElementById('new-type-name').value.trim();
  if (!name){ toast(state.lang==='vi'?'Vui lòng nhập tên':'이름을 입력해 주세요'); return; }
  apiMutate('addCustomType', { name: name, color: pickedSwatch, emoji: pickedEmoji }).then(function(){
    closeSheet('type-sheet');
    renderQuickActions();
    renderSettings();
    toast(t('savedToast'));
  }).catch(function(err){ toast(err.message); });
}

/* ================================================================
   PROFILE SHEET — first-run "who am I" (local only)
   ================================================================ */
function openProfilePicker(){
  renderAuthorChips('profile-chip-row', state.author, function(name){
    document.getElementById('profile-custom-input').value = '';
    state.author = name;
    $$('.chip', document.getElementById('profile-chip-row')).forEach(function(c){
      c.setAttribute('aria-pressed', String(c.dataset.name===name));
    });
  });
  document.getElementById('profile-custom-input').value = '';
  openSheet('profile-sheet');
}
function saveProfilePicker(){
  var custom = document.getElementById('profile-custom-input').value.trim();
  var picked = custom || state.author;
  if (!picked){ toast(state.lang==='vi'?'Vui lòng chọn hoặc nhập tên':'이름을 선택하거나 입력해 주세요'); return; }
  state.author = picked;
  localStorage.setItem(LS_AUTHOR, picked);
  closeSheet('profile-sheet');
  renderSettings();
  renderProfilePill();
  toast(t('savedToast'));
}

/* ================================================================
   GLOBAL RENDER
   ================================================================ */
function renderAll(){
  applyI18n();
  applyTheme();
  renderHeader();
  renderSinceLast();
  renderNextFeed();
  renderQuickActions();
  renderTimeline();   /* builds #active-bar-slot inside today's group */
  renderActiveBar();  /* ...then fills/updates it */
  renderStats();
  renderPattern();
  renderSettings();
  updateMemoPreview();
  renderMemoList();
}

/* ================================================================
   EVENT WIRING
   ================================================================ */
function switchTab(name){
  state.tab = name;
  $$('.tab-btn').forEach(function(x){ x.setAttribute('aria-current', String(x.dataset.tab===name)); });
  $$('[data-tab-panel]').forEach(function(p){ p.hidden = (p.id !== 'tab-'+name); });
  window.scrollTo(0,0);
  if (name === 'stats') renderStats();
  if (name === 'memo') renderMemoList();
  if (name === 'pattern') renderPattern();
  if (state.adjustOpen){ state.adjustOpen = false; var panel = document.getElementById('aw-adjust-panel'); if (panel) panel.hidden = true; }
}

function wireEvents(){
  $$('#lang-pill button').forEach(function(b){
    b.addEventListener('click', function(){
      state.lang = b.dataset.lang;
      localStorage.setItem(LS_LANG, state.lang);
      $$('#lang-pill button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
      renderAll();
    });
  });

  $$('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.dataset.tab); });
  });

  $$('#theme-seg button').forEach(function(b){
    b.addEventListener('click', function(){
      state.theme = b.dataset.themeOpt;
      localStorage.setItem(LS_THEME, state.theme);
      applyTheme();
    });
  });

  document.getElementById('btn-profile').addEventListener('click', openProfilePicker);

  // stats: feed range toggle (7/14/30 days)
  $$('#stats-feed-range button').forEach(function(b){
    b.addEventListener('click', function(){
      state.statsFeedDays = Number(b.dataset.range);
      $$('#stats-feed-range button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
      renderStats();
    });
  });

  // memo tab
  document.getElementById('memo-open-btn').addEventListener('click', function(){ switchTab('memo'); });
  document.getElementById('memo-compose-text').addEventListener('input', updateMemoComposeTranslateField);
  document.getElementById('memo-compose-submit').addEventListener('click', submitMemo);

  // entry detail full page
  document.getElementById('fp-entry-back').addEventListener('click', closeEntryDetail);
  document.getElementById('fp-entry-save').addEventListener('click', saveEntryDetail);
  document.getElementById('fp-entry-delete').addEventListener('click', deleteEntryDetail);

  // baby name/birth: live local preview on every keystroke (renderHeader reads
  // the focused input's live value — applyProfileToInputs skips it while
  // focused), persisted to the server on change/blur via setProfile.
  document.getElementById('set-baby-name-ko').addEventListener('input', renderHeader);
  document.getElementById('set-baby-name-vi').addEventListener('input', renderHeader);
  document.getElementById('set-baby-name-ko').addEventListener('change', function(){
    apiMutate('setProfile', { nameKo: this.value.trim() }).catch(function(err){ toast(err.message); });
  });
  document.getElementById('set-baby-name-vi').addEventListener('change', function(){
    apiMutate('setProfile', { nameVi: this.value.trim() }).catch(function(err){ toast(err.message); });
  });
  document.getElementById('set-baby-birth').addEventListener('change', function(){
    renderHeader();
    apiMutate('setProfile', { birth: this.value }).catch(function(err){ toast(err.message); });
  });

  document.getElementById('author-save-btn').addEventListener('click', function(){
    var v = document.getElementById('author-custom-input').value.trim();
    if (!v){ toast(state.lang==='vi'?'Vui lòng nhập tên':'이름을 입력해 주세요'); return; }
    document.getElementById('author-custom-input').value = '';
    setAuthor(v);
  });

  // type sheet
  document.getElementById('type-sheet-close').addEventListener('click', function(){ closeSheet('type-sheet'); });
  document.getElementById('type-sheet-cancel').addEventListener('click', function(){ closeSheet('type-sheet'); });
  document.getElementById('type-sheet-save').addEventListener('click', saveTypeSheet);
  document.getElementById('scrim2').addEventListener('click', function(){ closeSheet('type-sheet'); });

  // profile sheet
  document.getElementById('profile-save-btn').addEventListener('click', saveProfilePicker);
  document.getElementById('scrim3').addEventListener('click', function(){ closeSheet('profile-sheet'); });

}

/* ================================================================
   INIT
   ================================================================ */
function init(){
  $$('#lang-pill button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===state.lang)); });
  wireEvents();
  apiGetState().then(function(){
    renderAll();
    if (!state.author){ openProfilePicker(); }
  }).catch(function(err){
    toast(err.message || 'failed to load');
    renderAll();
  });
  setInterval(function(){ renderActiveBar(); renderSinceLast(); renderNextFeed(); }, 1000);
  setInterval(pollState, 4000);
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
