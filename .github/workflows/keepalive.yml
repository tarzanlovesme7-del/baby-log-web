# Keeps the site awake so it opens instantly.
#
# Render's free plan puts a service to sleep after 15 minutes with no traffic,
# and waking it takes 30-60 seconds — which is the whole reason the app felt
# slow to open. A cheap ping every 10 minutes keeps it running.
#
# It deliberately does NOT run overnight: the free plan includes 750 instance
# hours a month, and staying awake 24/7 would use nearly all of them. The
# window below is 05:00-24:00 Vietnam time (UTC+7), which covers every hour
# anyone in the house would actually open the app.
#
# It pings /healthz, not the app itself, so it wakes the web service without
# also keeping the database awake (the database has its own, much smaller,
# free allowance and wakes in well under a second).
name: keep zio-log awake

on:
  schedule:
    - cron: '*/10 22,23 * * *'   # 05:00-07:00 Vietnam
    - cron: '*/10 0-16 * * *'    # 07:00-24:00 Vietnam
  workflow_dispatch:              # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping the service
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://zio-log.onrender.com/healthz) || code=000
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "service did not answer 200"
          exit 1
